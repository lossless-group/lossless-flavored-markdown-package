name: Deploy splash to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Single-project repo — no submodules to fetch. The splash reads
          # ../changelog and ../context-v as plain file IO from the parent
          # repo's working tree.
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: splash/pnpm-lock.yaml

      # The splash imports the package's *source* (../../../src/index.ts), so
      # bare imports inside src/ resolve from the repo root's node_modules, not
      # the splash's. Installing the package's dependencies is therefore part of
      # building the site — it just looked optional locally, where a developer
      # always has both installed.
      - name: Install package deps (splash compiles package source)
        working-directory: .
        run: pnpm install --frozen-lockfile=false --ignore-workspace

      - name: Install
        run: pnpm install --frozen-lockfile=false --ignore-workspace

      - name: Build
        run: pnpm build
        env:
          # OpenPanel clientId is publicly visible in rendered HTML, so it
          # lives as a repo Variable, not a Secret. Set in repo settings →
          # Secrets and variables → Actions → Variables.
          OPENPANEL_CLIENT_ID: ${{ vars.OPENPANEL_CLIENT_ID }}

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enable Pages on first run so the workflow bootstraps itself
          # even when "Get Pages site" returns 404 the very first time.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: splash/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
